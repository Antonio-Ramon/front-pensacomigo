<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./ds-base.js"></script>
<style>body{margin:0}.pa-wrap{max-width:1100px;margin:0 auto;padding:0 22px}@media(max-width:760px){.pa-row{grid-template-columns:1fr!important}.pa-meta{display:none!important}}</style>
</helmet>
<div style="min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-ui)">
<header style="position:sticky;top:0;z-index:60;background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)">
<div class="pa-wrap" style="display:flex;align-items:center;justify-content:space-between;height:58px;gap:16px">
<div style="display:flex;align-items:center;gap:16px">
<a href="Home.dc.html" style="font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--ink);text-decoration:none">pensa<span style="color:var(--faint)">·</span>comigo</a>
<span style="font-family:var(--font-mono);font-size:11px;color:var(--faint)">/ admin / meditações</span>
</div>
<div style="display:flex;align-items:center;gap:14px">
<a href="Home.dc.html" style="font-family:var(--font-mono);font-size:11px;color:var(--soft);text-decoration:none">ver blog →</a>
<x-import component-from-global-scope="PensaComigoDesignSystem_3d6f1f.Button" size="sm" on-click="{{ goNew }}" hint-size="150px,34px">Nova meditação</x-import>
<div style="padding-left:12px;border-left:1px solid var(--line)"><x-import component-from-global-scope="PensaComigoDesignSystem_3d6f1f.ThemeSwitcher" hint-size="160px,28px"></x-import></div>
</div>
</div>
</header>
<main class="pa-wrap" style="padding-top:44px;padding-bottom:96px">
<p style="font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:lowercase;color:var(--faint);margin:0">painel do autor · <b style="color:var(--accent);font-weight:500">{{ countNote }}</b></p>
<h1 style="font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.5vw,44px);line-height:1.06;letter-spacing:-.022em;margin:12px 0 0">Todas as meditações</h1>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:28px">
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{ statusChips }}" as="s" hint-placeholder-count="4">
<button onClick="{{ s.toggle }}" style-hover="border-color:var(--soft)" style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;cursor:pointer;padding:7px 11px;border:1px solid {{ s.border }};background:{{ s.bg }};color:{{ s.color }};transition:all 150ms cubic-bezier(.22,.9,.3,1)">{{ s.label }}</button>
</sc-for>
</div>
<input value="{{ query }}" onChange="{{ setQuery }}" placeholder="buscar por título ou tag…" style="width:260px;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--font-mono);font-size:12px;padding:9px 12px;outline:none">
</div>
<div style="margin-top:22px;border-top:1px solid var(--line)">
<div class="pa-row" style="display:grid;grid-template-columns:110px 1fr 150px 110px 170px;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
<span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint)">DATA</span>
<span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint)">TÍTULO</span>
<span class="pa-meta" style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint)">AUTOR · ETAPA</span>
<span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint)">STATUS</span>
<span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint);text-align:right">AÇÕES</span>
</div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<div class="pa-row" style-hover="background:var(--bg-alt)" style="display:grid;grid-template-columns:110px 1fr 150px 110px 170px;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);transition:background 150ms cubic-bezier(.22,.9,.3,1)">
<span style="font-family:var(--font-mono);font-size:11px;color:var(--faint)">{{ r.date }}</span>
<span>
<a href="{{ r.href }}" style="font-family:var(--font-display);font-size:18px;letter-spacing:-.01em;color:var(--ink);text-decoration:none">{{ r.title }}</a><br>
<span style="font-family:var(--font-mono);font-size:10.5px;color:var(--faint)">{{ r.tagLine }}</span>
</span>
<span class="pa-meta" style="font-family:var(--font-mono);font-size:11px;color:var(--soft)">{{ r.metaLine }}</span>
<span><x-import component-from-global-scope="PensaComigoDesignSystem_3d6f1f.Badge" tone="{{ r.tone }}" hint-size="80px,22px">{{ r.status }}</x-import></span>
<span style="display:flex;gap:14px;justify-content:flex-end;align-items:center">
<a href="Editor.dc.html" style="font-family:var(--font-mono);font-size:11px;color:var(--soft);text-decoration:none">editar →</a>
<button onClick="{{ r.askDelete }}" style-hover="color:var(--danger)" style="font-family:var(--font-mono);font-size:11px;background:none;border:none;color:var(--faint);cursor:pointer;padding:0;transition:color 150ms cubic-bezier(.22,.9,.3,1)">excluir</button>
</span>
</div>
</sc-for>
</div>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="padding:30px 0">
<x-import component-from-global-scope="PensaComigoDesignSystem_3d6f1f.EmptyState" label="sem resultados" title="Ainda não há meditações por aqui." hint-size="100%,120px"></x-import>
</div>
</sc-if>
<p style="font-family:var(--font-mono);font-size:11px;color:var(--faint);margin:20px 0 0;min-height:16px">{{ note }}</p>
</main>
<x-import component-from-global-scope="PensaComigoDesignSystem_3d6f1f.ConfirmDialog" open="{{ confirmOpen }}" title="Excluir esta meditação?" message="{{ confirmMsg }}" confirm-label="Excluir" cancel-label="Cancelar" tone="danger" on-confirm="{{ doDelete }}" on-cancel="{{ cancelDelete }}" hint-size="0,0"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;papel&quot;,&quot;tinta&quot;,&quot;terra&quot;],&quot;default&quot;:&quot;papel&quot;,&quot;tsType&quot;:&quot;'papel'|'tinta'|'terra'&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  state = { db: null, extra: [], removed: [], status: null, query: '', confirmSlug: null, note: '' };

  extras = [
    { slug: 'draft-jonas', date: '17 ago 2026', title: 'Jonas fugiu na direção certa do mapa', dek: '', tags: ['Jonas 1', 'fuga'], author: 'antonio', stage: '01', status: 'rascunho' },
    { slug: 'sched-sabado', date: '18 ago 2026', title: 'O sábado não foi feito para render', dek: '', tags: ['Marcos 2', 'descanso'], author: 'jessica', stage: '04', status: 'agendado' },
  ];

  componentDidMount() {
    let saved = null; try { saved = localStorage.getItem('pc-theme'); } catch (e) {}
    const t = saved || this.props.theme;
    if (t) document.documentElement.dataset.theme = t;
    import('./posts.js').then(m => this.setState({ db: m }));
  }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) document.documentElement.dataset.theme = this.props.theme; }

  norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  renderVals() {
    const { db, status, query, removed, confirmSlug } = this.state;
    const stages = db ? db.STAGES : [];
    const authors = db ? db.AUTHORS : {};
    const all = db ? [...this.extras, ...db.POSTS.map(p => ({ ...p, status: 'publicado' }))] : [];
    const tones = { publicado: 'published', rascunho: 'draft', agendado: 'neutral' };
    const q = this.norm(query.trim());
    let list = all.filter(p => !removed.includes(p.slug));
    if (status) list = list.filter(p => p.status === status);
    if (q) list = list.filter(p => this.norm(p.title + ' ' + p.tags.join(' ')).includes(q));
    const counts = {};
    all.filter(p => !removed.includes(p.slug)).forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
    const target = all.find(p => p.slug === confirmSlug);
    return {
      countNote: all.filter(p => !removed.includes(p.slug)).length + ' textos',
      goNew: () => { location.href = 'Editor.dc.html'; },
      query, setQuery: e => this.setState({ query: e.target.value }),
      statusChips: ['publicado', 'rascunho', 'agendado'].map(st => {
        const on = status === st;
        return {
          label: st + ' · ' + (counts[st] || 0),
          toggle: () => this.setState({ status: on ? null : st }),
          bg: on ? 'var(--primary)' : 'var(--surface)',
          color: on ? 'var(--on-primary)' : 'var(--soft)',
          border: on ? 'var(--primary)' : 'var(--line)',
        };
      }),
      rows: list.map(p => {
        const stg = stages.find(s => s.number === p.stage);
        const a = authors[p.author];
        return {
          date: p.date, title: p.title, tagLine: p.tags.join(' · '),
          metaLine: (a ? a.name.toLowerCase() : '') + ' · ' + p.stage + (stg ? ' ' + stg.title.toLowerCase() : ''),
          status: p.status, tone: tones[p.status],
          href: p.status === 'publicado' ? 'Post.dc.html?slug=' + p.slug : 'Editor.dc.html',
          askDelete: () => this.setState({ confirmSlug: p.slug, note: '' }),
        };
      }),
      isEmpty: !!db && list.length === 0,
      note: this.state.note,
      confirmOpen: !!confirmSlug,
      confirmMsg: target ? '“' + target.title + '” sai do arquivo na hora. Esta ação não tem volta.' : '',
      cancelDelete: () => this.setState({ confirmSlug: null }),
      doDelete: () => this.setState(s => ({
        removed: [...s.removed, s.confirmSlug],
        confirmSlug: null,
        note: '✓ meditação excluída.',
      })),
    };
  }
}
</script>
</body>
</html>
