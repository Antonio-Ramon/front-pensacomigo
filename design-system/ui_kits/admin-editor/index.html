<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pensa comigo · Admin</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>body{margin:0;background:var(--bg-page)}a{color:var(--link)}a:hover{color:var(--link-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="data.js"></script>
<script type="text/babel" src="BlockEditor.jsx"></script>
<script type="text/babel" src="PostEditorScreen.jsx"></script>
<script type="text/babel" src="PostsListScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [view,setView]=React.useState('editor'); // start on the star component
  React.useEffect(()=>{ if(window.lucide) lucide.createIcons(); });
  return view==='list'
    ? <PostsListScreen onEdit={()=>{setView('editor');window.scrollTo(0,0);}} />
    : <PostEditorScreen onExit={()=>{setView('list');window.scrollTo(0,0);}} />;
}
function waitNS(){
  if(window.PensaComigoDesignSystem_3d6f1f && window.PostEditorScreen && window.PostsListScreen && window.BlockEditor){
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  } else setTimeout(waitNS,40);
}
waitNS();
</script></body></html>
