<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pensa comigo</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>html{transition:background var(--dur) var(--ease)}body{margin:0;background:var(--bg-page);transition:background var(--dur) var(--ease)}a{color:var(--link)}a:hover{color:var(--link-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="data.js"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="PostScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [route,setRoute]=React.useState({name:'home',post:null});
  const [dark,setDark]=React.useState(false);
  React.useEffect(()=>{ document.documentElement.setAttribute('data-theme', dark?'dark':'light'); },[dark]);
  React.useEffect(()=>{ if(window.lucide) lucide.createIcons(); });
  const open=(p)=>{ setRoute({name:'post',post:p}); window.scrollTo(0,0); };
  return (<React.Fragment>
    <SiteHeader onNav={()=>{setRoute({name:'home'});window.scrollTo(0,0);}} active={route.name} dark={dark} onToggleTheme={()=>setDark(d=>!d)} />
    {route.name==='home'
      ? <HomeScreen onOpen={open} />
      : <PostScreen post={route.post} onOpen={open} onBack={()=>{setRoute({name:'home'});window.scrollTo(0,0);}} />}
    <NewsletterSection />
    <SiteFooter />
  </React.Fragment>);
}
function waitNS(){
  if(window.PensaComigoDesignSystem_3d6f1f && window.HomeScreen && window.PostScreen && window.SiteHeader && window.NewsletterSection){
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  } else setTimeout(waitNS,40);
}
waitNS();
</script></body></html>
