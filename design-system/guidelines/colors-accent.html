<!-- @dsCard group="Colors" viewport="700x230" name="Accent teal — light & dark" subtitle="Primary teal, brightened on dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:#c9c2b4}
.pane{padding:18px 20px;background:var(--bg-page)}
.tl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:10px}
.row{display:flex;gap:12px}.sw{flex:1}.chip{height:46px;border-radius:var(--radius-md);border:1px solid var(--border-hair)}
.n{font-size:11px;color:var(--text-strong);margin-top:6px;font-weight:600}.v{font-size:10px;color:var(--text-muted)}</style></head>
<body>
<div class="pane">
<div class="tl">Light</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--accent-700)"></div><div class="n">700 pressed</div><div class="v">#0e5a5a</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-600)"></div><div class="n">600 primary</div><div class="v">#12766f</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-500)"></div><div class="n">500 vivid</div><div class="v">#2bb3a3</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-100)"></div><div class="n">100 tag</div><div class="v">#c4e9e3</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-050)"></div><div class="n">050 wash</div><div class="v">#e2f3ef</div></div>
</div></div>
<div class="pane dark">
<div class="tl">Dark</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--accent-700)"></div><div class="n">700 bright</div><div class="v">#7fdccf</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-600)"></div><div class="n">600 primary</div><div class="v">#43c2b2</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-500)"></div><div class="n">500</div><div class="v">#2bb3a3</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-100)"></div><div class="n">100 tag</div><div class="v">#173a37</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-050)"></div><div class="n">050 wash</div><div class="v">#132a28</div></div>
</div></div>
</body></html>
