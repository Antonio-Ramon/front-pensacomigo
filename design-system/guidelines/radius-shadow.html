<!-- @dsCard group="Spacing" viewport="700x180" name="Radius & shadow" subtitle="Tight radii, very subtle warm shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);padding:24px;font-family:var(--font-ui)}
.row{display:flex;gap:20px}.c{text-align:center}
.box{width:90px;height:70px;background:var(--white);border:1px solid var(--border-hair)}
.n{font-size:11px;color:var(--text-muted);margin-top:8px}</style></head>
<body><div class="row">
<div class="c"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">sm 2px</div></div>
<div class="c"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">md 6px</div></div>
<div class="c"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="n">lg 10px</div></div>
<div class="c"><div class="box" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-sm)"></div><div class="n">shadow-sm</div></div>
<div class="c"><div class="box" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-md)"></div><div class="n">shadow-md</div></div>
<div class="c"><div class="box" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-lg)"></div><div class="n">shadow-lg</div></div>
</div></body></html>
