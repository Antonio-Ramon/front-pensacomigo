<!-- @dsCard group="Foundations" viewport="760x300" name="Espaço &amp; layout" subtitle="Escala 4px, coluna de 940px, medida de 64ch" -->
<!DOCTYPE html><html data-theme="papel"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;background:var(--bg);font-family:var(--font-ui)}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint);margin:0 0 12px}
.scale{display:flex;align-items:flex-end;gap:10px;margin-bottom:28px}
.scale div{background:var(--primary-soft);border:1px solid var(--primary)}
.scale span{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--faint);margin-top:6px;text-align:center}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:11px;color:var(--soft)}
.bar i{display:block;height:8px;background:var(--bg-alt);border:1px solid var(--line)}</style></head>
<body>
<p class="k">ESCALA — 4 · 8 · 12 · 16 · 22 · 30 · 48 · 74 · 96</p>
<div class="scale">
<div style="width:4px;height:4px"><span>4</span></div><div style="width:8px;height:8px"><span>8</span></div><div style="width:12px;height:12px"><span>12</span></div><div style="width:16px;height:16px"><span>16</span></div><div style="width:22px;height:22px"><span>22</span></div><div style="width:30px;height:30px"><span>30</span></div><div style="width:48px;height:48px"><span>48</span></div><div style="width:74px;height:74px"><span>74</span></div><div style="width:96px;height:96px"><span>96</span></div>
</div>
<p class="k">LAYOUT</p>
<div class="bars">
<div class="bar"><i style="width:340px"></i>--container 940px</div>
<div class="bar"><i style="width:250px"></i>--measure 64ch (coluna de leitura)</div>
<div class="bar"><i style="width:70px"></i>--rail 190px (barra do artigo)</div>
<div class="bar"><i style="width:14px"></i>--gutter 22px</div>
</div>
</body></html>
