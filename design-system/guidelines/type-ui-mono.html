<!-- @dsCard group="Type" viewport="760x300" name="UI &amp; mono" subtitle="Inter Tight para interface, JetBrains Mono para etiquetas e referências" -->
<!DOCTYPE html><html data-theme="papel"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;background:var(--bg);font-family:var(--font-ui)}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint);margin:0 0 10px}
.row{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;margin-bottom:26px}
.ui16{font-size:16px;color:var(--ink)}.ui14{font-size:14px;color:var(--soft)}.ui13{font-size:13px;color:var(--soft)}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:lowercase;color:var(--faint)}
.eyebrow b{color:var(--accent);font-weight:500}
.mono{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;color:var(--soft)}
.cmd{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 7px}</style></head>
<body>
<p class="k">INTER TIGHT · CORPO DE INTERFACE</p>
<div class="row"><span class="ui16">16 · texto base</span><span class="ui14">14 · botões e meta</span><span class="ui13">13 · navegação</span></div>
<p class="k">JETBRAINS MONO · ETIQUETAS</p>
<div class="row">
<span class="eyebrow">meditações diárias · por <b>antonio &amp; jéssica</b></span>
<span class="mono">14 ago 2026 · 6 min de leitura</span>
<span class="cmd">› abrir --estado=cansado</span>
<span class="tag">1 Reis 19</span><span class="tag">descanso</span>
</div>
</body></html>
