<!-- @dsCard group="Colors" viewport="700x230" name="Semantic — light & dark" subtitle="Muted status, dark-adjusted" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:#c9c2b4}
.pane{padding:18px 20px;background:var(--bg-page)}
.tl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:10px}
.row{display:flex;gap:12px}.sw{flex:1}.chip{height:46px;border-radius:var(--radius-md);border:1px solid var(--border-hair);display:flex;gap:6px;padding:7px;box-sizing:border-box}
.chip div{flex:1;border-radius:4px}.n{font-size:11px;color:var(--text-strong);margin-top:6px;font-weight:600}.v{font-size:10px;color:var(--text-muted)}</style></head>
<body>
<div class="pane">
<div class="tl">Light</div>
<div class="row">
<div class="sw"><div class="chip"><div style="background:var(--success-600)"></div><div style="background:var(--success-100)"></div></div><div class="n">success</div><div class="v">#5c7052</div></div>
<div class="sw"><div class="chip"><div style="background:var(--warning-600)"></div><div style="background:var(--warning-100)"></div></div><div class="n">warning</div><div class="v">#a8803a</div></div>
<div class="sw"><div class="chip"><div style="background:var(--danger-600)"></div><div style="background:var(--danger-100)"></div></div><div class="n">danger</div><div class="v">#a2564b</div></div>
</div></div>
<div class="pane dark">
<div class="tl">Dark</div>
<div class="row">
<div class="sw"><div class="chip"><div style="background:var(--success-600)"></div><div style="background:var(--success-100)"></div></div><div class="n">success</div><div class="v">#8fb082</div></div>
<div class="sw"><div class="chip"><div style="background:var(--warning-600)"></div><div style="background:var(--warning-100)"></div></div><div class="n">warning</div><div class="v">#d3ad63</div></div>
<div class="sw"><div class="chip"><div style="background:var(--danger-600)"></div><div style="background:var(--danger-100)"></div></div><div class="n">danger</div><div class="v">#d68a7e</div></div>
</div></div>
</body></html>
