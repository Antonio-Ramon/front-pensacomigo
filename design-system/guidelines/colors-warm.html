<!-- @dsCard group="Colors" viewport="700x230" name="Warm accent — light & dark" subtitle="Terracotta + copper, glows on dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:#c9c2b4}
.pane{padding:18px 20px;background:var(--bg-page)}
.tl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:10px}
.row{display:flex;gap:12px}.sw{flex:1}.chip{height:46px;border-radius:var(--radius-md);border:1px solid var(--border-hair)}
.n{font-size:11px;color:var(--text-strong);margin-top:6px;font-weight:600}.v{font-size:10px;color:var(--text-muted)}</style></head>
<body>
<div class="pane">
<div class="tl">Light</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--warm-700)"></div><div class="n">700</div><div class="v">#5c3820</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-600)"></div><div class="n">600 terracota</div><div class="v">#7a4b2a</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-500)"></div><div class="n">500 copper</div><div class="v">#c9824a</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-sand)"></div><div class="n">sand</div><div class="v">#e0a877</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-100)"></div><div class="n">100</div><div class="v">#f0dcc4</div></div>
</div></div>
<div class="pane dark">
<div class="tl">Dark</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--warm-700)"></div><div class="n">700 bright</div><div class="v">#e8b98a</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-600)"></div><div class="n">600 copper</div><div class="v">#d3945b</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-500)"></div><div class="n">500</div><div class="v">#c9824a</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-sand)"></div><div class="n">sand</div><div class="v">#a86e42</div></div>
<div class="sw"><div class="chip" style="background:var(--warm-100)"></div><div class="n">100</div><div class="v">#3a2a1a</div></div>
</div></div>
</body></html>
