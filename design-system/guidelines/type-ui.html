<!-- @dsCard group="Type" viewport="700x150" name="UI & overline — Instrument Sans" subtitle="Nav, meta, labels, CAPS dateline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);padding:24px;font-family:var(--font-ui);color:var(--text-body)}
.over{font-size:var(--fs-ui-xs);font-weight:600;letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--accent-600);margin-bottom:12px}
.ui{font-size:var(--fs-ui);margin-bottom:4px}.sm{font-size:var(--fs-ui-sm);color:var(--text-muted)}
.lbl{font-family:var(--font-ui);font-size:11px;color:var(--text-faint);margin-top:12px}</style></head>
<body>
<div class="over">Meditação · 8 min de leitura</div>
<div class="ui">Início · Meditações · Tags · Sobre</div>
<div class="sm">por Antonio · 12 jul 2026</div>
<div class="lbl">overline: fs-ui-xs CAPS tracking 0.14em · ui 16px · meta 14px</div>
</body></html>
