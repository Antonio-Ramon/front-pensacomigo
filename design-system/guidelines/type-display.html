<!DOCTYPE html><html data-theme="papel"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;background:var(--bg)}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint);margin:0 0 6px}
h1{font-family:var(--font-display);font-weight:400;font-size:56px;line-height:1.04;letter-spacing:-.022em;margin:0 0 24px;color:var(--ink);max-width:16ch}
h1 em{font-style:italic;color:var(--primary)}
h2{font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:-.02em;margin:0 0 20px;color:var(--ink)}
h3{font-family:var(--font-display);font-weight:500;font-size:20px;margin:0;color:var(--ink)}</style></head>
<body>
<p class="k">H1 · 66/38PX CLAMP · 400 · -0.022EM</p>
<h1>A dúvida não é o oposto da fé. É <em>por onde ela começa</em>.</h1>
<p class="k">H2 · 36PX · 400</p><h2>Como você chega hoje?</h2>
<p class="k">H3 · 20PX · 500</p><h3>Elias dormiu antes de ouvir a voz</h3>
</body></html>
