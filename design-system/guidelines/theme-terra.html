<!-- @dsCard group="Themes" viewport="700x300" name="terra" subtitle="Sépia — argila, madeira, azul de ardósia" -->
<!DOCTYPE html><html data-theme="terra"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:26px;background:var(--bg)}
.h{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.h b{font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:-.02em;color:var(--ink)}
.h span{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--faint)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw .chip{height:54px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.sw .n{font-family:var(--font-mono);font-size:10px;color:var(--ink);margin-top:7px}
.sw .v{font-family:var(--font-mono);font-size:9.5px;color:var(--faint)}
.demo{margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--font-ui);font-size:14px;font-weight:500;padding:11px 20px;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);border:none}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.q{font-family:var(--font-display);font-weight:300;font-size:19px;color:var(--ink)}
.q mark{background:var(--mark);color:inherit;padding:1px 3px;border-radius:2px}
.ref{font-family:var(--font-mono);font-size:11px;color:var(--accent)}</style></head>
<body>
<div class="h"><b>terra</b><span>data-theme="terra"</span></div>
<div class="row"><div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="n">bg</div><div class="v">#EFE7DB</div></div><div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="n">surface</div><div class="v">#F8F3EA</div></div><div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="n">ink</div><div class="v">#2C2318</div></div><div class="sw"><div class="chip" style="background:var(--primary)"></div><div class="n">primary</div><div class="v">#8A5334</div></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="n">accent</div><div class="v">#3D5A73</div></div><div class="sw"><div class="chip" style="background:var(--line)"></div><div class="n">line</div><div class="v">#DDCFB9</div></div></div>
<div class="demo"><button class="btn">Ler a meditação</button><button class="btn g">arquivo</button><span class="ref">&gt; 1 Reis 19:7</span></div>
<p class="q">A dúvida não é o oposto da fé. É <mark>por onde ela começa</mark>.</p>
</body></html>
