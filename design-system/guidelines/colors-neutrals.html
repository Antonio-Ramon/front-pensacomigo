<!-- @dsCard group="Colors" viewport="700x230" name="Base neutrals — light & dark" subtitle="Warm off-white ↔ warm charcoal" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:#c9c2b4;padding:0}
.pane{padding:18px 20px}.pane.dark{background:var(--bg-page)}.pane.lt{background:var(--bg-page)}
.tl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:10px}
.row{display:flex;gap:12px}.sw{flex:1}.chip{height:46px;border-radius:var(--radius-md);border:1px solid var(--border-hair)}
.n{font-size:11px;color:var(--text-strong);margin-top:6px;font-weight:600}.v{font-size:10px;color:var(--text-muted)}</style></head>
<body>
<div class="pane lt">
<div class="tl">Light</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--paper-0)"></div><div class="n">page</div><div class="v">#faf8f3</div></div>
<div class="sw"><div class="chip" style="background:var(--paper-1)"></div><div class="n">sunken</div><div class="v">#f2eee5</div></div>
<div class="sw"><div class="chip" style="background:var(--white)"></div><div class="n">card</div><div class="v">#fdfcf9</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">text</div><div class="v">#1e1c18</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">meta</div><div class="v">#6c6353</div></div>
</div></div>
<div class="pane dark">
<div class="tl">Dark</div>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--paper-0)"></div><div class="n">page</div><div class="v">#16150f</div></div>
<div class="sw"><div class="chip" style="background:var(--paper-1)"></div><div class="n">sunken</div><div class="v">#211f18</div></div>
<div class="sw"><div class="chip" style="background:var(--white)"></div><div class="n">card</div><div class="v">#1e1c15</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">text</div><div class="v">#f2ede2</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">meta</div><div class="v">#a49b88</div></div>
</div></div>
</body></html>
