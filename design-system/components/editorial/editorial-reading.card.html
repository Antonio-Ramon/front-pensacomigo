const body = `
<p>Elias acabou de vencer o maior confronto público da sua carreira profética. No capítulo 18, fogo desce do céu diante de centenas de testemunhas. No capítulo 19, ele está sentado debaixo de um arbusto no deserto, pedindo para morrer.</p>
<h2>A resposta de Deus não é um sermão</h2>
<p>Diante de um profeta em colapso, Deus não repreende. Manda um anjo com pão e água. E deixa ele dormir. <mark>Duas vezes.</mark></p>`;
function Demo(){return(<div style={{display:'flex',flexDirection:'column',gap:34}}>

  <StudyNote>O verbo hebraico usado para o toque do anjo (נָגַע, <em>naga</em>) é o mesmo empregado em contextos de contato físico gentil. Não é uma sacudida — é um toque.</StudyNote>
  <ApplyList items={['Verifique quantas horas você realmente dormiu nesta semana','Faça uma refeição sem tela e sem pressa hoje','Antes de cobrar direção de Deus, pergunte se você deu ao corpo o que ele pediu']}/>
  <Reactions options={[{label:'Isso me ajudou',count:128},{label:'Orei por isso',count:46},{label:'Vou reler',count:19}]}/>
  <AuthorBox name="Antonio" initials="AR" bio="Escreve os textos de estudo do Pensa Comigo. Gosta de texto original e de perguntas que não têm resposta rápida."/>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
