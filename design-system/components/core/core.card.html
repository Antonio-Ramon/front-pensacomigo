<!DOCTYPE html><html data-theme="papel"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>body{margin:0;background:var(--bg);padding:26px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--faint);margin-bottom:12px}.grid{display:flex;flex-direction:column;gap:26px}.r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Tag, Chip, Badge, Avatar, Input, Select, Textarea, EmptyState, ConfirmDialog, SectionHeading, ThemeSwitcher } = window.PensaComigoDesignSystem_3d6f1f;
function Demo(){
  const [del,setDel]=React.useState(false);
  const [mood,setMood]=React.useState('cansado');
  return (<div className="grid">
    <SectionHeading eyebrow="core" title="Elementos de interface" hint="Botões-pílula, chips mono e campos hairline — tudo em Inter Tight sobre superfícies de 1px."/>
    <div><div className="lbl">BOTÕES</div><div className="r">
      <Button>Começar por onde você está</Button>
      <Button variant="ghost">Ver todas</Button>
      <Button variant="accent">Assinar</Button>
      <Button variant="quiet" size="sm">arquivo completo →</Button>
      <Button disabled>Desativado</Button>
      <IconButton icon="search" label="Buscar" variant="outline"/>
      <IconButton icon="bookmark" label="Salvar" variant="outline"/>
    </div></div>
    <div><div className="lbl">CHIPS &amp; TAGS</div><div className="r">
      {['cansado','em dúvida','com medo','grato'].map(m=>
        <Chip key={m} pressed={mood===m} onClick={()=>setMood(mood===m?null:m)}>{m}</Chip>)}
      <Tag>1 Reis 19</Tag><Tag tone="accent">descanso</Tag><Tag tone="primary">João 20</Tag>
      <Badge tone="published">publicado</Badge><Badge tone="draft">rascunho</Badge>
    </div></div>
    <div><div className="lbl">CAMPOS</div><div className="r" style={{alignItems:'flex-end'}}>
      <Input label="E-MAIL" placeholder="seu@email.com" wrapStyle={{width:250}}/>
      <Select label="AUTOR" options={['Antonio','Jéssica']} wrapStyle={{width:170}}/>
      <Avatar name="Antonio Ribeiro"/><Avatar name="Jéssica Ribeiro"/>
      <ThemeSwitcher/>
    </div></div>
    <div className="r">
      <EmptyState title="Ainda não há meditações por aqui." label="arquivo vazio" style={{flex:1}}
        action={<Button size="sm" variant="ghost" onClick={()=>setDel(true)}>Excluir rascunho…</Button>}/>
    </div>
    <ConfirmDialog open={del} tone="danger" title="Excluir meditação?"
      message="“Elias dormiu antes de ouvir a voz” será removida permanentemente."
      confirmLabel="Excluir" onCancel={()=>setDel(false)} onConfirm={()=>setDel(false)}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>setTimeout(()=>window.lucide&&lucide.createIcons(),80);</script></body></html>
